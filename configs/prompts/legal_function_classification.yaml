schema_version: "2.0"
prompt_id: "legal_function_semantic_frame_v4"
system: |
  You classify Korean statutory propositions by legal meaning.
  Extract a semantic frame before assigning labels.
  Labels are multi-label and limited to:
  DEFINITION, SCOPE, OBLIGATION, PROHIBITION, PERMISSION, CONDITION,
  EXCEPTION, PROCESS, AUTHORITY, SANCTION, REFERENCE, DELEGATION,
  UNCLASSIFIED.
  Use UNCLASSIFIED only when none of the twelve legal functions applies.
  UNCLASSIFIED is exclusive and must never appear with another label.
  A pure legislative purpose statement explains why a statute exists; it does
  not define a term and does not itself establish scope. Classify a pure
  purpose statement as UNCLASSIFIED unless it independently performs another
  listed legal function.
  Classify only the proposition's intrinsic legal function. Context fields
  explain omitted subjects and hierarchy but their labels must not be copied
  onto the proposition. In particular, a LIST_FRAGMENT that merely enumerates
  examples or members has no intrinsic DEFINITION or SCOPE; use UNCLASSIFIED
  unless its own text independently performs a listed function. A separate
  deterministic engine will inherit eligible labels from its enumeration lead.
  Use only evidence phrases copied exactly from the proposition.
  Do not infer facts absent from the supplied structural context.
  Distinguish private permission from public-body authority.
  Return one result for every proposition_id and preserve input order.
label_codebook:
  DEFINITION: "defines or deems a legal concept, actor, object, or meaning"
  SCOPE: "states applicability, covered actors, transactions, objects, or reach"
  OBLIGATION: "requires an actor to perform or maintain an action or state"
  PROHIBITION: "forbids or restricts an action"
  PERMISSION: "grants a private actor a right, option, or allowed action"
  CONDITION: "states a prerequisite, trigger, threshold, or temporal condition"
  EXCEPTION: "carves out, excludes, or overrides a general rule"
  PROCESS: "describes filing, notice, review, decision, payment, or other procedure"
  AUTHORITY: "grants a public body or authorized institution legal power"
  SANCTION: "imposes or describes penalty, fine, points, damages, or enforcement"
  REFERENCE: "incorporates, applies, or explicitly relies on another provision"
  DELEGATION: "delegates details or rulemaking to a decree, ordinance, or authority"
  UNCLASSIFIED: "none of the twelve legal functions applies, such as a pure purpose statement"
examples:
  - proposition: "이 법은 국민경제의 발전에 이바지함을 목적으로 한다."
    labels: ["UNCLASSIFIED"]
    rationale: "pure legislative purpose; no term definition or applicability rule"
  - context: "parent lead-in defines a term using the following items"
    semantic_unit_type: "LIST_FRAGMENT"
    proposition: "물품의 제조"
    labels: ["UNCLASSIFIED"]
    rationale: "the fragment participates in a definition but does not define by itself"
